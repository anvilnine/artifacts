name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default. Only the publish job below asks for `packages: write`, so a
# pull request run never holds a token that can write to the registry.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      ARTIFACTS_API_KEY: ci-test-key
      # Seed the admin from env so CI boots via the admin-seed path (exercises scrypt
      # at module init — guards against ordering/TDZ regressions in the hash helpers).
      ARTIFACTS_ADMIN_USERNAME: ci-admin
      ARTIFACTS_ADMIN_PASSWORD: ci-admin-password
      DATA_DIR: /tmp/artifacts-data
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        # The job seeds ARTIFACTS_ADMIN_* for the server boot below. createAuthStore reads
        # those from the environment, so clear them here and let each test set its own.
        env:
          ARTIFACTS_ADMIN_USERNAME: ''
          ARTIFACTS_ADMIN_PASSWORD: ''
        run: npm test
      - name: A rejected admin seed fails the boot
        # npm test drives createAuthStore directly, so it never proves server.js turns the
        # thrown AdminSeedError into an exit instead of an unhandled-rejection stack.
        env:
          ARTIFACTS_ADMIN_USERNAME: ci-admin
          ARTIFACTS_ADMIN_PASSWORD: short
          DATA_DIR: /tmp/artifacts-seed-check
        run: |
          rm -rf /tmp/artifacts-seed-check
          set +e
          # A regression here boots and listens instead of exiting, so bound the wait.
          # timeout answers 124 on that, which fails the step in seconds, not at the job cap.
          out=$(timeout 30 node server.js 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" = 1 ] || { echo "expected exit 1, got $code"; exit 1; }
          case "$out" in
            ARTIFACTS_ADMIN_PASSWORD\ rejected*) ;;
            *) echo "expected the AdminSeedError line, got the above"; exit 1 ;;
          esac
          case "$out" in
            *"at createAuthStore"*) echo "printed a stack trace"; exit 1 ;;
          esac
          [ ! -e /tmp/artifacts-seed-check/artifacts/auth.json ] \
            || { echo "auth.json was written on the refused path"; exit 1; }
      - name: Boot server
        run: |
          node server.js &
          echo $! > server.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/healthz && break
            sleep 0.5
          done
      - name: Smoke test API
        run: bash .github/workflows/smoke.sh http://localhost:3000 ci-test-key
      # Ahead of the malformed-auth.json step on purpose: that step replaces the whole keys
      # array, so a key minted for a durability check would not survive it. This one asserts
      # the record comes back; the one below asserts a broken record does not take the key
      # screen down with it. Any step needing a real auth record goes above this comment.
      # The malformed-auth.json step destroys the record and stays last in this job.
      - name: Artifacts and API keys survive a fresh restart (new process, same data dir)
        run: |
          curl -sf -X POST http://localhost:3000/api/artifacts \
            -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' \
            -d '{"content":"<h1>durable</h1>","slug":"restart-proof","visibility":"public"}'
          # An artifact surviving proves the backend keeps objects; only a key proves auth.json
          # came back, which is the separate promise docs/auth.md makes. The local backend is
          # the one the README's quick start uses and it had no survival check before this: the
          # restart in the step below exists to plant a malformed record and asserts nothing
          # about durability. A key rather than an admin login, because the seed re-creates the
          # admin with the same password whenever the record has no admin, so a login answers
          # 200 even when auth.json is gone. A key cannot be re-seeded.
          curl -sf -X POST http://localhost:3000/api/keys \
            -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' \
            -d '{"name":"restart-proof","scopes":["read"]}' > /tmp/minted-key.json
          key=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/minted-key.json","utf8")).key)')
          # Without this a changed response shape leaves $key as the string "undefined", and the
          # check below then blames durability for a 401 the mint caused. The dump is scrubbed on
          # the token itself, not on the field name: this guard only ever fires when the field
          # moved, so a name-based scrub (what smoke.sh uses, where the shape is known) would
          # match nothing in exactly the case that reaches this line.
          case "$key" in ah_*) ;; *) echo "FAIL: the mint returned no key"; sed 's/ah_[A-Za-z0-9]*/ah_REDACTED/g' /tmp/minted-key.json; exit 1 ;; esac
          old_pid=$(cat server.pid)
          kill "$old_pid"; sleep 1
          # kill returns 0 once the signal is delivered, not once the process is gone. If a
          # graceful-shutdown handler is ever added to server.js, the old process outlives this
          # line, the new one dies on EADDRINUSE, healthz answers from the survivor, and the key
          # check below passes out of its in-memory auth record with the backend empty. Assert
          # the old process is gone rather than trusting the signal.
          kill -0 "$old_pid" 2>/dev/null \
            && { echo "FAIL: the old server outlived the kill, so nothing below would test a restart"; exit 1; }
          node server.js &
          echo $! > server.pid
          for i in $(seq 1 20); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
          # The loop above exits 0 whether or not anything ever answered, so a server that died
          # on the second boot would reach the checks below and be reported as lost data. Name
          # the real cause instead. T1.1.14 covers the same hole in every other boot loop.
          curl -sf http://localhost:3000/healthz > /dev/null \
            || { echo "FAIL: the server did not come back up after the restart"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/a/restart-proof)
          [ "$code" = "200" ] || { echo "FAIL: artifact did not survive a restart on the local backend (got $code)"; exit 1; }
          echo "ok: artifact survived a restart on the local backend"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" \
            http://localhost:3000/api/artifacts)
          [ "$code" = "200" ] || { echo "FAIL: the key minted before the restart stopped working on the local backend (got $code)"; curl -s -H 'Authorization: Bearer ci-test-key' http://localhost:3000/api/keys; exit 1; }
          echo "ok: the key minted before the restart still works"
      - name: Key routes survive a malformed auth.json
        run: |
          # A hand edit, or a crash partway through a write, leaves records the bearer path
          # skips: no hash, plus a null or a bare string in the array. Every key-management
          # route used to 500 on those, which is the screen the boot warning sends the
          # operator to. Plant all three and drive the routes the dashboard drives.
          pkill -f 'node server.js' || true
          sleep 1
          node -e '
            const fs = require("fs");
            const p = process.env.DATA_DIR + "/artifacts/auth.json";
            const a = JSON.parse(fs.readFileSync(p, "utf8"));
            a.keys = [null, "ak_live_oops", { id: "k_broken", name: "broken" }];
            fs.writeFileSync(p, JSON.stringify(a, null, 2));
          '
          node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
          AUTH='Authorization: Bearer ci-test-key'
          code=$(curl -s -o /tmp/keys.json -w '%{http_code}' -H "$AUTH" http://localhost:3000/api/keys)
          [ "$code" = "200" ] || { echo "FAIL: GET /api/keys -> $code"; exit 1; }
          grep -q '"broken":true' /tmp/keys.json || { echo "FAIL: broken record not flagged"; cat /tmp/keys.json; exit 1; }
          if grep -q '"id":null' /tmp/keys.json; then echo "FAIL: unaddressable entry listed"; cat /tmp/keys.json; exit 1; fi
          echo "ok: GET /api/keys lists the broken record and skips the unaddressable entries"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"disabled":true}' http://localhost:3000/api/keys/k_broken)
          [ "$code" = "200" ] || { echo "FAIL: PATCH /api/keys/k_broken -> $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$AUTH" http://localhost:3000/api/keys/k_broken)
          [ "$code" = "200" ] || { echo "FAIL: DELETE /api/keys/k_broken -> $code"; exit 1; }
          if curl -s -H "$AUTH" http://localhost:3000/api/keys | grep -q k_broken; then echo "FAIL: revoked record still listed"; exit 1; fi
          echo "ok: the broken record patches and revokes from the key screen"

  smoke-s3:
    runs-on: ubuntu-latest
    env:
      ARTIFACTS_API_KEY: ci-test-key
      # Every backend seeds the admin, not just the local one. The seed is the only boot-time
      # write the server makes, so a backend that throws on that write fails the job instead of
      # failing on someone's server. It fires on the first boot of the job only (it is gated on
      # an empty admin), so it is a boot check, not a durability one. Durability is the restart
      # step below.
      ARTIFACTS_ADMIN_USERNAME: ci-admin
      ARTIFACTS_ADMIN_PASSWORD: ci-admin-password
      PORT: 3000
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: artifacts
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start MinIO + create bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/ready && break
            sleep 1
          done
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://artifacts
      - name: Boot server (s3 backend)
        run: |
          node server.js &
          echo $! > server.pid
          for i in $(seq 1 20); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
      - name: Smoke test API against S3
        run: bash .github/workflows/smoke.sh http://localhost:3000 ci-test-key
      - name: Artifacts and API keys survive a fresh restart (no local disk)
        run: |
          curl -sf -X POST http://localhost:3000/api/artifacts \
            -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' \
            -d '{"content":"<h1>durable</h1>","slug":"restart-proof","visibility":"public"}'
          # Mint a managed key on the way in. An artifact surviving proves the backend keeps
          # objects; only a key proves auth.json came back, which is the separate promise
          # docs/auth.md makes and which nothing used to check.
          # The check uses a key instead of an admin login: the seed re-creates the admin with
          # the same password whenever the record has no admin, so logging in answers 200 even
          # when auth.json is gone. A key cannot be re-seeded, so it is the only half of the
          # record that can fail here.
          curl -sf -X POST http://localhost:3000/api/keys \
            -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' \
            -d '{"name":"restart-proof","scopes":["read"]}' > /tmp/minted-key.json
          key=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/minted-key.json","utf8")).key)')
          # Without this a changed response shape leaves $key as the string "undefined", and the
          # check below then blames durability for a 401 the mint caused. The dump is scrubbed on
          # the token itself, not on the field name: this guard only ever fires when the field
          # moved, so a name-based scrub (what smoke.sh uses, where the shape is known) would
          # match nothing in exactly the case that reaches this line.
          case "$key" in ah_*) ;; *) echo "FAIL: the mint returned no key"; sed 's/ah_[A-Za-z0-9]*/ah_REDACTED/g' /tmp/minted-key.json; exit 1 ;; esac
          # kill the server and start a brand-new process against the same bucket, with
          # nothing on local disk — proves durability across a container reprovision.
          kill "$(cat server.pid)"; sleep 1
          node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/a/restart-proof)
          [ "$code" = "200" ] || { echo "FAIL: artifact did not survive restart (got $code)"; exit 1; }
          echo "ok: artifact survived a fresh restart via S3"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" \
            http://localhost:3000/api/artifacts)
          [ "$code" = "200" ] || { echo "FAIL: the key minted before the restart stopped working (got $code)"; curl -s -H 'Authorization: Bearer ci-test-key' http://localhost:3000/api/keys; exit 1; }
          echo "ok: the key minted before the restart still works"

  smoke-git:
    runs-on: ubuntu-latest
    env:
      ARTIFACTS_API_KEY: ci-test-key
      ARTIFACTS_ADMIN_USERNAME: ci-admin
      ARTIFACTS_ADMIN_PASSWORD: ci-admin-password
      PORT: 3000
      STORAGE_BACKEND: git
      GIT_REMOTE_URL: http://127.0.0.1:4600/artifacts.git
      GIT_BRANCH: main
      GIT_WORK_DIR: /tmp/git-work
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start a git HTTP remote
        run: |
          mkdir -p /tmp/git-remote
          git init --bare --initial-branch=main /tmp/git-remote/artifacts.git
          git -C /tmp/git-remote/artifacts.git config http.receivepack true
          node .github/workflows/git-http-server.mjs 4600 /tmp/git-remote &
          for i in $(seq 1 20); do
            curl -sf 'http://127.0.0.1:4600/artifacts.git/info/refs?service=git-upload-pack' >/dev/null && break
            sleep 0.5
          done
      - name: Boot server (git backend)
        run: |
          node server.js &
          echo $! > server.pid
          for i in $(seq 1 20); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
      - name: Smoke test API against git
        run: bash .github/workflows/smoke.sh http://localhost:3000 ci-test-key
      - name: Artifacts and API keys survive a fresh restart (new work dir, rehydrate from remote)
        run: |
          curl -sf -X POST http://localhost:3000/api/artifacts \
            -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' \
            -d '{"content":"<h1>durable</h1>","slug":"restart-proof","visibility":"public"}'
          # auth.json has to reach the remote like any other object, or the fresh work dir
          # below clones back an instance with no admin and no keys.
          curl -sf -X POST http://localhost:3000/api/keys \
            -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' \
            -d '{"name":"restart-proof","scopes":["read"]}' > /tmp/minted-key.json
          key=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/minted-key.json","utf8")).key)')
          # Without this a changed response shape leaves $key as the string "undefined", and the
          # check below then blames durability for a 401 the mint caused. The dump is scrubbed on
          # the token itself, not on the field name: this guard only ever fires when the field
          # moved, so a name-based scrub (what smoke.sh uses, where the shape is known) would
          # match nothing in exactly the case that reaches this line.
          case "$key" in ah_*) ;; *) echo "FAIL: the mint returned no key"; sed 's/ah_[A-Za-z0-9]*/ah_REDACTED/g' /tmp/minted-key.json; exit 1 ;; esac
          kill "$(cat server.pid)"; sleep 1
          # brand-new working copy -> the server must clone it back from the git remote
          GIT_WORK_DIR=/tmp/git-work-fresh node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/a/restart-proof)
          [ "$code" = "200" ] || { echo "FAIL: artifact did not survive restart (got $code)"; exit 1; }
          echo "ok: artifact rehydrated from the git remote after a fresh restart"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" \
            http://localhost:3000/api/artifacts)
          [ "$code" = "200" ] || { echo "FAIL: the key minted before the restart did not rehydrate (got $code)"; curl -s -H 'Authorization: Bearer ci-test-key' http://localhost:3000/api/keys; exit 1; }
          echo "ok: the key minted before the restart rehydrated too"

  smoke-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: artifacts
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARTIFACTS_API_KEY: ci-test-key
      ARTIFACTS_ADMIN_USERNAME: ci-admin
      ARTIFACTS_ADMIN_PASSWORD: ci-admin-password
      PORT: 3000
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgres://postgres:pw@127.0.0.1:5432/artifacts
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Boot server (postgres backend)
        run: |
          node server.js &
          echo $! > server.pid
          for i in $(seq 1 20); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
      - name: Smoke test API against postgres
        run: bash .github/workflows/smoke.sh http://localhost:3000 ci-test-key
      - name: Artifacts and API keys survive a fresh restart (external DB)
        run: |
          curl -sf -X POST http://localhost:3000/api/artifacts \
            -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' \
            -d '{"content":"<h1>durable</h1>","slug":"restart-proof","visibility":"public"}'
          curl -sf -X POST http://localhost:3000/api/keys \
            -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' \
            -d '{"name":"restart-proof","scopes":["read"]}' > /tmp/minted-key.json
          key=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/minted-key.json","utf8")).key)')
          # Without this a changed response shape leaves $key as the string "undefined", and the
          # check below then blames durability for a 401 the mint caused. The dump is scrubbed on
          # the token itself, not on the field name: this guard only ever fires when the field
          # moved, so a name-based scrub (what smoke.sh uses, where the shape is known) would
          # match nothing in exactly the case that reaches this line.
          case "$key" in ah_*) ;; *) echo "FAIL: the mint returned no key"; sed 's/ah_[A-Za-z0-9]*/ah_REDACTED/g' /tmp/minted-key.json; exit 1 ;; esac
          kill "$(cat server.pid)"; sleep 1
          node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/a/restart-proof)
          [ "$code" = "200" ] || { echo "FAIL: artifact did not survive restart (got $code)"; exit 1; }
          echo "ok: artifact survived a fresh restart via postgres"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" \
            http://localhost:3000/api/artifacts)
          [ "$code" = "200" ] || { echo "FAIL: the key minted before the restart stopped working (got $code)"; curl -s -H 'Authorization: Bearer ci-test-key' http://localhost:3000/api/keys; exit 1; }
          echo "ok: the key minted before the restart still works"
      - name: Two replicas do not clobber each other's auth writes
        run: |
          # postgres is one of the two backends that can host a fleet, so this is where the
          # replica case belongs. Replica A has been up since the restart step above, so it
          # holds the whole auth record as it looked then. That stale snapshot is what used
          # to do the damage: any change of A's own wrote all of it back.
          node server.js & # replica B, same database, left running for the next step
          for i in $(seq 1 20); do curl -sf http://localhost:3001/healthz && break; sleep 0.5; done
        env:
          PORT: 3001
      - name: Neither replica's write reverts the other's password change or key
        run: |
          AUTH='Authorization: Bearer ci-test-key'
          JSON='Content-Type: application/json'
          # Change the seeded admin's password on replica B. The job seeds the account from
          # env, so there is no unclaimed setup route to go through here.
          curl -sf -X POST http://localhost:3001/api/auth/login -H "$JSON" -c /tmp/jar \
            -d '{"username":"ci-admin","password":"ci-admin-password"}' > /dev/null
          curl -sf -X POST http://localhost:3001/api/auth/password -H "$JSON" -b /tmp/jar \
            -d '{"currentPassword":"ci-admin-password","newPassword":"second-password"}' > /dev/null
          # One write on each replica, B first and A last. Order is the whole test: a replica
          # keeps whatever it wrote itself, so only a later write by the OTHER replica can
          # reveal a stale snapshot. A goes last because it has held its copy since the
          # restart step, which makes it the one carrying the pre-change password and no
          # knowledge of B's key. In production the write that does this is not an admin
          # action at all: a key's lastUsedAt is refreshed through the same path, so an
          # ordinary bearer read does it.
          curl -sf -X POST http://localhost:3001/api/keys -H "$AUTH" -H "$JSON" \
            -d '{"name":"minted-on-b","scopes":["read"]}' > /dev/null
          curl -sf -X POST http://localhost:3000/api/keys -H "$AUTH" -H "$JSON" \
            -d '{"name":"minted-on-a","scopes":["read"]}' > /dev/null
          # A third replica reads the record fresh. It is the only honest way to ask what the
          # backend actually holds now.
          PORT=3002 node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3002/healthz && break; sleep 0.5; done
          new=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3002/api/auth/login \
            -H "$JSON" -d '{"username":"ci-admin","password":"second-password"}')
          old=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3002/api/auth/login \
            -H "$JSON" -d '{"username":"ci-admin","password":"ci-admin-password"}')
          [ "$new" = "200" ] || { echo "FAIL: new password -> $new (the change was reverted)"; exit 1; }
          [ "$old" = "401" ] || { echo "FAIL: old password -> $old (the change was reverted)"; exit 1; }
          echo "ok: the password change on B survived the later write on A"
          curl -sf -H "$AUTH" http://localhost:3002/api/keys > /tmp/fleet-keys.json
          # minted-on-b is the live one: A wrote after it and had never seen it. minted-on-a
          # is a sanity check on what C reads, since A cannot lose its own write.
          grep -q minted-on-b /tmp/fleet-keys.json \
            || { echo "FAIL: the key minted on B is gone"; cat /tmp/fleet-keys.json; exit 1; }
          grep -q minted-on-a /tmp/fleet-keys.json \
            || { echo "FAIL: the key minted on A is gone"; cat /tmp/fleet-keys.json; exit 1; }
          echo "ok: both replicas' keys survived each other's writes"

  smoke-sqlite:
    runs-on: ubuntu-latest
    env:
      ARTIFACTS_API_KEY: ci-test-key
      ARTIFACTS_ADMIN_USERNAME: ci-admin
      ARTIFACTS_ADMIN_PASSWORD: ci-admin-password
      PORT: 3000
      STORAGE_BACKEND: sqlite
      SQLITE_PATH: /tmp/artifacts.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Boot server (sqlite backend)
        run: |
          node server.js &
          echo $! > server.pid
          for i in $(seq 1 20); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
      - name: Smoke test API against sqlite
        run: bash .github/workflows/smoke.sh http://localhost:3000 ci-test-key
      - name: Artifacts and API keys survive a fresh restart (new process, same database file)
        run: |
          curl -sf -X POST http://localhost:3000/api/artifacts \
            -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' \
            -d '{"content":"<h1>durable</h1>","slug":"restart-proof","visibility":"public"}'
          # An artifact surviving proves the backend keeps objects; only a key proves auth.json
          # came back, which is the separate promise docs/auth.md makes for all five backends
          # and which this job never checked. A key rather than an admin login, because the seed
          # re-creates the admin with the same password whenever the record has no admin, so a
          # login answers 200 even when auth.json is gone. A key cannot be re-seeded.
          curl -sf -X POST http://localhost:3000/api/keys \
            -H 'Authorization: Bearer ci-test-key' -H 'Content-Type: application/json' \
            -d '{"name":"restart-proof","scopes":["read"]}' > /tmp/minted-key.json
          key=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/minted-key.json","utf8")).key)')
          # Without this a changed response shape leaves $key as the string "undefined", and the
          # check below then blames durability for a 401 the mint caused. The dump is scrubbed on
          # the token itself, not on the field name: this guard only ever fires when the field
          # moved, so a name-based scrub (what smoke.sh uses, where the shape is known) would
          # match nothing in exactly the case that reaches this line.
          case "$key" in ah_*) ;; *) echo "FAIL: the mint returned no key"; sed 's/ah_[A-Za-z0-9]*/ah_REDACTED/g' /tmp/minted-key.json; exit 1 ;; esac
          old_pid=$(cat server.pid)
          kill "$old_pid"; sleep 1
          # kill returns 0 once the signal is delivered, not once the process is gone. If a
          # graceful-shutdown handler is ever added to server.js, the old process outlives this
          # line, the new one dies on EADDRINUSE, healthz answers from the survivor, and the key
          # check below passes out of its in-memory auth record with the backend empty. Assert
          # the old process is gone rather than trusting the signal.
          kill -0 "$old_pid" 2>/dev/null \
            && { echo "FAIL: the old server outlived the kill, so nothing below would test a restart"; exit 1; }
          node server.js &
          echo $! > server.pid
          for i in $(seq 1 20); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
          # The loop above exits 0 whether or not anything ever answered, and a second process
          # opening the same database file is exactly where a boot failure would show up, so
          # name that instead of reporting it as lost data. T1.1.14 covers the other boot loops.
          curl -sf http://localhost:3000/healthz > /dev/null \
            || { echo "FAIL: the server did not come back up after the restart"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/a/restart-proof)
          [ "$code" = "200" ] || { echo "FAIL: artifact did not survive a restart via sqlite (got $code)"; exit 1; }
          echo "ok: artifact survived a restart via sqlite"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" \
            http://localhost:3000/api/artifacts)
          [ "$code" = "200" ] || { echo "FAIL: the key minted before the restart stopped working via sqlite (got $code)"; curl -s -H 'Authorization: Bearer ci-test-key' http://localhost:3000/api/keys; exit 1; }
          echo "ok: the key minted before the restart still works"

  # Pull requests build the image and boot it, so a broken Dockerfile (or a change to what the
  # container reads at boot) fails before merge instead of after. No push, and no registry
  # credentials: this job is read-only and has no login step.
  docker-build:
    if: github.event_name == 'pull_request'
    needs: [smoke, smoke-s3, smoke-git, smoke-postgres, smoke-sqlite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: artifacts-host:ci-${{ github.run_id }}
      CONTAINER: artifacts-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Smoke test container
        run: |
          docker run -d --name "$CONTAINER" -p 3000:3000 \
            -e ARTIFACTS_API_KEY=ci-test-key \
            -e ARTIFACTS_ADMIN_USERNAME=ci-admin -e ARTIFACTS_ADMIN_PASSWORD=ci-admin-password \
            "$IMAGE"
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/healthz && break
            sleep 0.5
          done
          bash .github/workflows/smoke.sh http://localhost:3000 ci-test-key
      # A GitHub-hosted runner is thrown away after the job, so this is not needed there. It is
      # here so the job stays correct if it ever moves to the org's self-hosted runner, where the
      # container and image would survive and the name would collide on a re-run.
      - name: Clean up
        if: always()
        run: |
          docker rm -f "$CONTAINER" || true
          docker image rm -f "$IMAGE" || true

  docker:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [smoke, smoke-s3, smoke-git, smoke-postgres, smoke-sqlite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t artifacts-host .
      - name: Smoke test container
        run: |
          docker run -d --name artifacts -p 3000:3000 \
            -e ARTIFACTS_API_KEY=ci-test-key \
            -e ARTIFACTS_ADMIN_USERNAME=ci-admin -e ARTIFACTS_ADMIN_PASSWORD=ci-admin-password \
            artifacts-host
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/healthz && break
            sleep 0.5
          done
          bash .github/workflows/smoke.sh http://localhost:3000 ci-test-key
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag artifacts-host ghcr.io/${{ github.repository_owner }}/artifacts:latest
          docker tag artifacts-host ghcr.io/${{ github.repository_owner }}/artifacts:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/artifacts:latest
          docker push ghcr.io/${{ github.repository_owner }}/artifacts:${{ github.sha }}
      # On a v1.3.0 tag this also publishes :1.3.0 and :1.3, so deploys can pin a version.
      - name: Push version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          image=ghcr.io/${{ github.repository_owner }}/artifacts
          version=${REF_NAME#v}
          docker tag artifacts-host "$image:$version"
          docker tag artifacts-host "$image:${version%.*}"
          docker push "$image:$version"
          docker push "$image:${version%.*}"
